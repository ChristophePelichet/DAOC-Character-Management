name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create and upload files to a Release

    steps:
    - name: Get source code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Compile executable
      run: pyinstaller DAOC-Character-Manager.spec

    - name: Check and Rename executable
      run: |
        Write-Host "Files in dist directory:"
        Get-ChildItem -Path "dist\" -Filter "*.exe" | Format-List
        
        $exeFile = Get-ChildItem -Path "dist\" -Filter "*.exe" | Select-Object -First 1
        if ($exeFile) {
          $newName = "DAOC Character Manager.exe"
          $newPath = Join-Path -Path $exeFile.DirectoryName -ChildPath $newName
          Rename-Item -Path $exeFile.FullName -NewName $newName -Force
          Write-Host "Renamed to: $newName"
          Write-Host "Updated files in dist:"
          Get-ChildItem -Path "dist\" -Filter "*.exe" | Format-List
        } else {
          Write-Host "No .exe file found!"
        }
      shell: powershell

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DAOC Character Manager
        path: dist/*.exe

    - name: Create and Publish Release
      if: startsWith(github.ref, 'refs/tags/') # Only run this step if we pushed a tag
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
        generate_release_notes: true
        overwrite: true
        body: |
          ## 📥 Quick Download
          * 🪟 **Windows:** Download the `.exe` file below.
          * 🍎 **macOS:** Download the `.zip` file below.
          
          > 💡 **Tip for Mac users:** If you get a security warning, **Right-Click** the app and select **Open**.
          
          ---
          ### 🛠️ Installation
          1. Download the version for your OS.
          2. Extract the files (for Mac) or run the `.exe` (for Windows).
          3. Enjoy managing your DAOC characters!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}