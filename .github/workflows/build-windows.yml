name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create and upload files to a Release

    steps:
    - name: Get source code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Compile executable
      run: pyinstaller DAOC-Character-Manager.spec

    - name: Rename executable
      run: |
        Get-ChildItem dist/*.exe | Rename-Item -NewName "DAOC Character Manager.exe"
      shell: powershell

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DAOC Character Manager
        path: dist/*.exe

    - name: Create and Publish Release
      if: startsWith(github.ref, 'refs/tags/') # Only run this step if we pushed a tag
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}