name: Build macOS Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write # Required to create and upload files to a Release

    steps:
    - name: Get source code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements-macos.txt ]; then pip install -r requirements-macos.txt; fi

    - name: Compile executable
      run: pyinstaller DAOC-Character-Manager.spec

    - name: Zip App Bundle
      # macOS apps are folders; they must be zipped for easy distribution
      run: |
        cd dist
        zip -r ../DaocCharacterManager-Mac.zip "DaocCharacterManager.app"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DaocCharacterManager-Mac-Zip
        path: DaocCharacterManager-Mac.zip

    - name: Publish Release
      # Only runs when a tag is pushed (v1.0.0, etc.)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: DaocCharacterManager-Mac.zip
        generate_release_notes: true
        overwrite: true
        body: |
          ## 📥 Quick Download
          * 🪟 **Windows:** Download the `.exe` file below.
          * 🍎 **macOS:** Download the `.zip` file below.
          
          > 💡 **Tip for Mac users:** If you get a security warning, **Right-Click** the app and select **Open**.
          
          ---
          ### 🛠️ Installation
          1. Download the version for your OS.
          2. Extract the files (for Mac) or run the `.exe` (for Windows).
          3. Enjoy managing your DAOC characters!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}